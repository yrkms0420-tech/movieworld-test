<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='#14151a'/%3E%3Cmask id='m'%3E%3Crect width='64' height='64' fill='#fff'/%3E%3Ccircle cx='12' cy='32' r='6' fill='#000'/%3E%3Ccircle cx='52' cy='32' r='6' fill='#000'/%3E%3Cpath d='M32 18v28' stroke='#000' stroke-width='2.5' stroke-dasharray='3.5 3.5'/%3E%3C/mask%3E%3Crect x='12' y='16' width='40' height='32' rx='5' fill='#d97757' mask='url%28#m%29'/%3E%3C/svg%3E">
<title>무비월드 — 영화 취향 테스트</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg: #14151a;
    --surface: #1e2027;
    --line: #33363f;
    --text: #f2efe8;
    --sub: #9a9aa3;
    --accent: #d97757;
    --accent-dim: rgba(217, 119, 87, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 44px 20px 72px;
    word-break: keep-all;
  }
  .wrap { width: 100%; max-width: 560px; }

  .eyebrow { font-size: 12px; letter-spacing: 0.18em; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
  h1 { font-size: 28px; font-weight: 700; line-height: 1.38; letter-spacing: -0.02em; margin-bottom: 12px; }
  .lede { font-size: 15px; line-height: 1.8; color: var(--sub); margin-bottom: 36px; }

  .start-btn, .again {
    width: 100%; border: none; border-radius: 12px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    padding: 16px; cursor: pointer; transition: opacity 0.2s;
  }
  .start-btn { background: var(--accent); color: #14151a; }
  .start-btn:hover { opacity: 0.9; }
  .again {
    background: none; border: 1px solid var(--line); color: var(--sub);
    font-weight: 500; font-size: 14px; padding: 13px; margin-top: 12px;
  }
  .again:hover { color: var(--text); border-color: var(--sub); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 질문 상단: 이전 버튼 + 문항 번호 */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; padding: 6px 8px 6px 2px; margin-left: -2px;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--sub);
    cursor: pointer; transition: color 0.15s;
  }
  .back-btn svg { width: 16px; height: 16px; }
  .back-btn:hover { color: var(--text); }
  .opt.selected { border-color: var(--accent); background: var(--accent-dim); }

  /* 진행 표시 */
  .progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .progress span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background 0.3s; }
  .progress span.on { background: var(--accent); }

  .q-num { font-size: 12px; letter-spacing: 0.14em; color: var(--sub); font-weight: 600; }
  .q-title { font-size: 21px; font-weight: 600; line-height: 1.5; letter-spacing: -0.015em; margin-bottom: 24px; }

  .opt {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.6;
    padding: 16px 18px; margin-bottom: 10px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover { border-color: var(--accent); background: var(--surface); }
  .skip-btn {
    display: block; margin: 6px auto 0; padding: 10px 12px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--sub);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
    transition: color 0.15s;
  }
  .skip-btn:hover { color: var(--text); }
  .skip-btn.selected { color: var(--accent); text-decoration-color: var(--accent); }
  .skip-note {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: var(--surface); color: var(--sub); font-size: 13.5px; line-height: 1.6;
  }

  /* 결과 티켓: 종이 영화표 */
  .ticket {
    --paper: #f4f0e6;
    --ink: #17181d;
    --ink-sub: #5d5e66;
    --cut: 12px;
    position: relative;
    background: var(--paper);
    color: var(--ink);
    /* 네 모서리를 안쪽으로 파낸 티켓 모양 */
    -webkit-mask:
      radial-gradient(circle at 0 0, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) top left / 51% 51% no-repeat,
      radial-gradient(circle at 100% 0, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) top right / 51% 51% no-repeat,
      radial-gradient(circle at 0 100%, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) bottom left / 51% 51% no-repeat,
      radial-gradient(circle at 100% 100%, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) bottom right / 51% 51% no-repeat;
            mask:
      radial-gradient(circle at 0 0, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) top left / 51% 51% no-repeat,
      radial-gradient(circle at 100% 0, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) top right / 51% 51% no-repeat,
      radial-gradient(circle at 0 100%, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) bottom left / 51% 51% no-repeat,
      radial-gradient(circle at 100% 100%, transparent var(--cut), #000 calc(var(--cut) + 0.5px)) bottom right / 51% 51% no-repeat;
    animation: print 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes print { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ticket { animation: none; } }

  .ticket-main { padding: 22px 24px 24px; }
  .t-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
    padding-bottom: 14px; margin-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }
  .t-head .admit { color: #b4532f; }
  .t-label { font-size: 12px; font-weight: 600; color: var(--ink-sub); margin-bottom: 8px; }
  .type-name { font-size: 26px; font-weight: 800; line-height: 1.3; letter-spacing: -0.03em; margin-bottom: 14px; }
  .keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .kw {
    border: 1.5px solid #b4532f; color: #b4532f;
    font-size: 12.5px; font-weight: 700; padding: 4px 11px; border-radius: 100px;
  }
  .type-desc { font-size: 14.5px; line-height: 1.75; color: var(--ink-sub); }

  /* 상영 정보 */
  .t-info {
    display: grid; grid-template-columns: repeat(3, 1fr);
    margin-top: 22px; border-top: 1px solid rgba(23, 24, 29, 0.15);
  }
  .t-info div { padding: 12px 0 0; }
  .t-info div + div { padding-left: 14px; border-left: 1px solid rgba(23, 24, 29, 0.15); }
  .t-info dt { font-size: 11px; font-weight: 600; color: var(--ink-sub); margin-bottom: 4px; }
  .t-info dd { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 절취선 아래 반쪽(스텁) */
  .ticket-stub {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 24px 20px;
    background: var(--accent); color: var(--ink);
  }
  .ticket-stub::before {
    content: ''; position: absolute; top: -1px; left: 18px; right: 18px;
    border-top: 2px dashed rgba(23, 24, 29, 0.45);
  }
  .ticket-stub::after, .stub-notch {
    content: ''; position: absolute; top: -9px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--bg);
  }
  .ticket-stub::after { right: -9px; }
  .stub-notch { left: -9px; }
  .stub-no dt { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; opacity: 0.7; margin-bottom: 3px; }
  .stub-no dd { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .barcode { height: 38px; width: 132px; flex: none; }

  /* 티켓 아래 추천작 */
  .recs-wrap { margin-top: 28px; }
  .recs-label { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 2px; }
  .recs-wrap + .again { margin-top: 32px; }
  .rec { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .rec:last-child { border-bottom: none; padding-bottom: 0; }
  .detail-btn {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 12px;
    border: 1px solid var(--line); border-radius: 100px;
    padding: 7px 13px 7px 14px;
    font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none;
    transition: border-color 0.15s, color 0.15s;
  }
  .detail-btn svg { width: 12px; height: 12px; }
  .detail-btn:hover { border-color: var(--accent); color: var(--accent); }
  .detail-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rec-title { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; }
  .rec-title span { color: var(--sub); font-weight: 400; font-size: 13.5px; margin-left: 6px; }
  .rec-why { font-size: 13.5px; line-height: 1.65; color: var(--sub); }

  .screen { display: none; }
  .screen.active { display: block; }

  @media (max-width: 480px) {
    body { padding: 36px 16px 60px; }
    h1 { font-size: 24px; }
    .q-title { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 화면 -->
  <div class="screen active" id="startScreen">
    <div class="eyebrow">MOVIEWORLD</div>
    <h1>나는 어떤 영화를<br>좋아하는 사람일까?</h1>
    <p class="lede">장르 말고, 영화를 보는 마음을 물어볼게요. 열 개의 질문에 끌리는 쪽을 고르면 열다섯 가지 유형 중 당신의 영화 취향과 어울리는 영화를 알려드려요. 2분이면 충분해요.</p>
    <button class="start-btn" id="startBtn" type="button">테스트 시작하기</button>
  </div>

  <!-- 질문 화면 -->
  <div class="screen" id="quizScreen">
    <div class="quiz-head">
      <button class="back-btn" id="backBtn" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        이전
      </button>
      <div class="q-num" id="qNum"></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="q-title" id="qTitle"></div>
    <div id="opts"></div>
    <button class="skip-btn" id="skipBtn" type="button">잘 모르겠어요, 넘어갈게요</button>
  </div>

  <!-- 결과 화면 -->
  <div class="screen" id="resultScreen">
    <article class="ticket" aria-label="영화 취향 티켓">
      <div class="ticket-main">
        <div class="t-head"><span>MOVIEWORLD</span><span class="admit">ADMIT ONE</span></div>
        <div class="t-label">당신의 영화 취향</div>
        <h2 class="type-name" id="typeName"></h2>
        <div class="keywords" id="typeKeywords"></div>
        <p class="type-desc" id="typeDesc"></p>
        <dl class="t-info">
          <div><dt>상영일</dt><dd id="tDate"></dd></div>
          <div><dt>상영관</dt><dd id="tHall"></dd></div>
          <div><dt>좌석</dt><dd id="tSeat"></dd></div>
        </dl>
      </div>
      <div class="ticket-stub">
        <span class="stub-notch" aria-hidden="true"></span>
        <dl class="stub-no"><dt>TICKET NO.</dt><dd id="tNo"></dd></dl>
        <svg class="barcode" id="tBarcode" viewBox="0 0 132 38" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </article>
    <p class="skip-note" id="skipNote" hidden>넘긴 질문이 많아서 결과가 조금 덜 정확할 수 있어요. 다시 해보면 더 꼭 맞는 티켓이 나올지도 몰라요.</p>
    <section class="recs-wrap">
      <h3 class="recs-label">이 티켓으로 볼 수 있는 영화</h3>
      <div id="typeRecs"></div>
    </section>
    <button class="again" id="againBtn" type="button">다시 해보기</button>
  </div>

</div>

<script>
  // ── 취향 유형 15개 ──
  // movies: 유형마다 후보 6편. 결과에는 고른 답 조합에 따라 3편이 정해져서 보여요. (같은 답이면 같은 3편)
  // weight: 뽑힐 확률 가중치. 기본값 1이고, 0.5면 절반 정도 덜 나와요. (한국 상업영화는 0.5)
  // '상세보기' 버튼을 누르면 '영화 제목 연도'로 구글 검색 결과가 새 탭에서 열려요.
  const TYPES = {
    blank: {
      name: '여백을 사랑하는 사람',
      keywords: ['느린 호흡', '말보다 풍경', '긴 여운'],
      desc: '당신에게 영화는 사건이 아니라 시간이에요. 대사가 없어도, 풍경과 침묵만으로 마음이 차오르는 순간을 아는 사람. 엔딩 크레딧이 올라간 뒤에도 한참을 그 세계에 머무르죠.',
      movies: [
        { title: '노매드랜드', year: '2020', why: '길 위의 삶을 재촉하지 않고 끝까지 따라가는 영화예요.' },
        { title: '퍼펙트 데이즈', year: '2023', why: '반복되는 하루가 이렇게 아름다울 수 있다는 걸 보여줘요.' },
        { title: '콜럼버스', year: '2017', why: '건축과 침묵 사이로 두 사람의 마음이 천천히 흐릅니다.' },
        { title: '패터슨', year: '2016', why: '버스 운전사의 똑같은 일주일이 한 편의 시처럼 흘러가요.' },
        { title: '드라이브 마이 카', year: '2021', why: '긴 드라이브와 침묵 속에서 마음이 천천히 열려요.' },
        { title: '남매의 여름밤', year: '2020', why: '할아버지 집에서 보낸 여름이 오래된 사진처럼 남아요.' }
      ]
    },
    heart: {
      name: '사람의 마음을 들여다보는 사람',
      keywords: ['섬세한 감정', '관계의 결', '이해와 오해'],
      desc: '당신이 궁금한 건 사건의 결말이 아니라 사람의 속마음이에요. 인물이 왜 그런 선택을 했는지, 말하지 못한 마음은 무엇인지 — 영화가 끝나도 그 사람들이 계속 생각나는 타입이죠.',
      movies: [
        { title: '괴물', year: '2023', why: '같은 시간을 세 개의 마음으로 다시 보여주는 영화예요.' },
        { title: '벌새', year: '2018', why: '한 소녀의 계절을 이토록 가까이에서 지켜본 적이 있었나요.' },
        { title: '애프터썬', year: '2022', why: '지나고 나서야 보이는 마음이 있다는 걸 알려줘요.' },
        { title: '결혼 이야기', year: '2019', why: '헤어지는 두 사람의 마음을 어느 한쪽 편 없이 들여다봐요.' },
        { title: '맨체스터 바이 더 씨', year: '2016', why: '말하지 못한 슬픔을 이토록 조용히 그린 영화는 드물어요.' },
        { title: '아무도 모른다', year: '2004', why: '세상이 보지 못한 아이들의 시간을 담담하게 따라가요.' }
      ]
    },
    plot: {
      name: '이야기에 빠져드는 사람',
      keywords: ['촘촘한 플롯', '반전의 쾌감', '몰입'],
      desc: '당신은 잘 짜인 이야기의 힘을 믿는 사람이에요. 흩어진 단서가 하나로 맞춰지는 순간, 예상을 배반하는 전개 — 두 시간 동안 스크린에서 눈을 뗄 수 없게 만드는 영화가 당신의 영화예요.',
      movies: [
        { title: '나이브스 아웃', year: '2019', why: '고전 추리극의 재미를 가장 세련되게 되살린 영화예요.' },
        { title: '올드보이', year: '2003', weight: 0.5, why: '마지막 장면의 충격은 아직도 회자되죠.' },
        { title: '서치', year: '2018', why: '화면 구성부터 결말까지, 한순간도 긴장을 놓을 수 없어요.' },
        { title: '메멘토', year: '2000', why: '거꾸로 흐르는 이야기 속에서 직접 퍼즐을 맞추게 돼요.' },
        { title: '나를 찾아줘', year: '2014', why: '사라진 아내, 볼수록 믿을 수 없는 이야기가 펼쳐져요.' },
        { title: '프레스티지', year: '2006', why: '두 마술사의 대결, 마지막 트릭까지 눈을 떼면 안 돼요.' }
      ]
    },
    world: {
      name: '다른 세계로 떠나는 사람',
      keywords: ['낯선 세계', '상상력', '시각적 경험'],
      desc: '당신에게 영화관은 현실에서 가장 먼 곳으로 가는 문이에요. 처음 보는 세계, 이곳에 없는 규칙, 스크린이 아니면 만날 수 없는 이미지 — 영화만이 줄 수 있는 경험을 찾는 사람이죠.',
      movies: [
        { title: '에브리씽 에브리웨어 올 앳 원스', year: '2022', why: '멀티버스를 이토록 엉뚱하고 뭉클하게 그린 영화는 없었어요.' },
        { title: '듄: 파트 2', year: '2024', why: '스크린이 클수록 좋은, 압도적인 세계가 펼쳐져요.' },
        { title: '스파이더맨: 뉴 유니버스', year: '2018', why: '애니메이션이 갈 수 있는 가장 먼 곳까지 가본 작품이에요.' },
        { title: '컨택트', year: '2016', why: '외계의 언어를 배우며 시간을 다르게 보게 되는 영화예요.' },
        { title: '판의 미로', year: '2006', why: '잔혹한 현실과 어두운 동화가 아름답게 겹쳐져요.' },
        { title: '매트릭스', year: '1999', why: '지금 보는 세계가 진짜일까, 그 질문의 시작이에요.' }
      ]

      { title: '쇼생크 탈출', year: '1994', why: '오래도록 사랑받는 데에는 이유가 있다는 걸 보여줘요.' }
    ]
  };

  // ── 질문 10개 · 선택지 4개 · 선택지마다 [주 유형(+2), 보조 유형(+1)] ──
  // '잘 모르겠어요'로 넘긴 질문은 0점이에요.
  // 넘기지 않고 모두 답한 조합(1,048,576가지) 기준 유형별 결과 비율은 5.7~7.4%로 고르게 나와요. (완전 균등은 6.7%)
  // 선택지의 유형이나 질문 순서를 바꾸면 비율이 달라질 수 있어요.
  const QUESTIONS = [
    {
      q: '오늘 밤 필요한 온도는?',
      opts: [
        { t: '마음이 데워지는 따뜻함', s: ['warm', 'anim'] },

      ]
    },
    {
      q: '영화의 속도, 어느 쪽이 좋아요?',
      opts: [
        { t: '느려도 좋아요. 천천히 스며드는 쪽', s: ['heart', 'love'] },
        { t: '한순간도 못 놓게 몰아치는 쪽', s: ['rush', 'chill'] },
        { t: '리듬감 있게 통통 튀는 쪽', s: ['laugh', 'anim'] },
        { t: '숨죽인 채 조금씩 조여 오는 쪽', s: ['fear', 'plot'] }
      ]
    },
    {
      q: '영화를 보고 난 뒤, 어떤 기분이 좋아요?',
      opts: [
        { t: '소중한 사람에게 괜히 연락하고 싶어지는 기분', s: ['warm', 'heart'] },
        { t: '해석과 숨은 장치를 찾아보고 싶어지는 기분', s: ['plot', 'classic'] },
        { t: '그 세계가 꿈에 나올 것 같은 기분', s: ['anim', 'fear'] },
        { t: '한동안 아무 말도 하기 싫은 먹먹한 기분', s: ['blank', 'heart'] }
      ]
    },
    {
      q: '극장에서 가장 짜릿한 순간은?',
      opts: [
        { t: '숨소리마저 멈춘 듯한 팽팽한 정적', s: ['chill', 'fear'] },
        { t: '객석 전체가 한꺼번에 터지는 웃음', s: ['laugh', 'anim'] },
        { t: '모두가 비명을 삼키는 순간', s: ['fear', 'world'] },
        { t: '스크린을 꽉 채우는 추격 장면', s: ['rush', 'world'] }
      ]
    },
    {
      q: '영화가 끝났을 때, 더 좋은 쪽은?',
      opts: [
        { t: '해석의 여지를 남기는, 여운이 긴 엔딩', s: ['blank', 'classic'] },
        { t: '모든 퍼즐이 맞춰지는 명쾌한 결말', s: ['plot', 'chill'] },
        { t: '박수가 절로 나오는 통쾌한 마무리', s: ['rush', 'laugh'] },
        { t: '모든 걸 뒤집는 반전 엔딩', s: ['plot', 'chill'] }
      ]
    },
    {
      q: '더 보고 싶은 이야기는?',
      opts: [
        { t: '시간이 지나도 회자되는 고전 속 이야기', s: ['classic', 'real'] },
        { t: '현실의 규칙을 벗어난 세계의 이야기', s: ['world', 'fear'] },
        { t: '엇갈리고 다시 만나는 사랑 이야기', s: ['love', 'youth'] },
        { t: '실제로 있었던 일을 다룬 이야기', s: ['real', 'heart'] }
      ]
    },
    {
      q: '마음이 가는 주인공은?',
      opts: [
        { t: '아무도 보지 않는 문제를 끝까지 파고드는 사람', s: ['real', 'plot'] },
        { t: '서툴지만 자기 길을 찾아가는 사람', s: ['youth', 'heart'] },
        { t: '무대 위에서 모든 걸 쏟아내는 사람', s: ['music', 'rush'] },
        { t: '어디서든 사람들을 웃게 만드는 사람', s: ['laugh', 'youth'] }
      ]
    },
    {
      q: '영화를 고를 때 가장 먼저 끌리는 건?',
      opts: [
        { t: '오랫동안 명작으로 꼽혀온 작품', s: ['classic', 'blank'] },
        { t: '배우들의 연기가 압도적이라는 평', s: ['heart', 'real'] },
        { t: '사운드트랙이 좋다는 입소문', s: ['music', 'youth'] },
        { t: '처음 보는 세계관이라는 소개', s: ['world', 'anim'] }
      ]
    },
    {
      q: '마음이 가장 크게 움직이는 순간은?',
      opts: [
        { t: '두 사람이 서로를 알아보는 순간', s: ['love', 'classic'] },
        { t: '감춰졌던 진실이 세상에 드러나는 순간', s: ['real', 'rush'] },
        { t: '주인공이 한 뼘 자라는 순간', s: ['youth', 'warm'] },
        { t: '헤어졌던 가족이 다시 만나는 순간', s: ['warm', 'heart'] }
      ]
    },
    {
      q: '가장 끌리는 장면은?',
      opts: [
        { t: '대사 없이 풍경과 음악만 흐르는 장면', s: ['blank', 'music'] },
        { t: '두 인물이 팽팽하게 맞서는 대화 장면', s: ['chill', 'classic'] },
        { t: '손으로 그린 듯한 세계가 살아 움직이는 장면', s: ['anim', 'warm'] },
        { t: '노래와 춤이 터져 나오는 장면', s: ['music', 'laugh'] }
      ]
    }
  ];

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const progressEl = document.getElementById('progress');
  let current = 0;
  let answers = []; // 질문별로 고른 선택지 번호. 뒤로 가서 다시 고르면 덮어써요.

  QUESTIONS.forEach(() => {
    const s = document.createElement('span');
    progressEl.appendChild(s);
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    current = 0;
    answers = [];
    show(quizScreen);
    renderQuestion();
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    show(startScreen);
  });

  // 이전: 첫 질문에서는 시작 화면으로, 그 외에는 이전 질문으로 돌아가요.
  document.getElementById('backBtn').addEventListener('click', () => {
    if (current === 0) {
      show(startScreen);
      return;
    }
    current--;
    renderQuestion();
  });

  function show(screen) {
    [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function renderQuestion() {
    const q = QUESTIONS[current];
    document.getElementById('qNum').textContent = `Q${current + 1} / ${QUESTIONS.length}`;
    document.getElementById('qTitle').textContent = q.q;
    [...progressEl.children].forEach((s, i) => s.classList.toggle('on', i <= current));

    const optsEl = document.getElementById('opts');
    optsEl.innerHTML = '';
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.textContent = opt.t;
      // 뒤로 돌아온 질문이면 이전에 고른 답을 표시해요.
      if (answers[current] === idx) btn.classList.add('selected');
      btn.addEventListener('click', () => answer(idx));
      optsEl.appendChild(btn);
    });
    document.getElementById('skipBtn').classList.toggle('selected', answers[current] === SKIP);
  }

  // 답을 기록하고 다음으로. SKIP(-1)은 '잘 모르겠어요'예요.
  const SKIP = -1;
  const SKIP_NOTE_MIN = 5; // 이만큼 이상 넘기면 결과 아래에 안내 문구를 보여줘요.
  function answer(idx) {
    answers[current] = idx;
    current++;
    if (current < QUESTIONS.length) renderQuestion();
    else renderResult();
  }
  document.getElementById('skipBtn').addEventListener('click', () => answer(SKIP));

  // 답 조합을 숫자 하나로 바꿔요. 좌석·티켓 번호·추천작이 모두 이 숫자로 정해져요.
  function answerCode() {
    return answers.reduce((acc, a) => acc * 5 + (a + 1), 0);
  }

  // 후보 중 3편을 가중치에 따라 뽑아요. 같은 답 조합이면 늘 같은 3편이 나와요.
  function pickMovies(movies, code) {
    if (movies.length <= 3) return movies;
    let seed = (code * 2654435761) % 4294967296;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
    const pool = movies.map(m => ({ m, w: m.weight ?? 1 }));
    const picked = [];
    while (picked.length < 3) {
      const total = pool.reduce((sum, p) => sum + p.w, 0);
      let r = rand() * total;
      const i = pool.findIndex(p => (r -= p.w) < 0);
      picked.push(pool.splice(i === -1 ? pool.length - 1 : i, 1)[0].m);
    }
    return picked;
  }

  // ── 티켓 정보: 고른 답으로 티켓 번호·좌석·바코드가 정해져요 ──
  function fillTicketInfo(typeKey) {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('tDate').textContent = `${String(d.getFullYear()).slice(2)}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
    const hall = typeKey ? Object.keys(TYPES).indexOf(typeKey) + 1 : 0;
    document.getElementById('tHall').textContent = typeKey ? `${pad(hall)}관` : '특별관';

    // 답 조합을 숫자 하나로 바꿔서 좌석과 티켓 번호를 만들어요. 같은 답이면 같은 좌석이에요.
    const code = answerCode();
    const rows = 'ABCDEFGHJK';
    document.getElementById('tSeat').textContent = `${rows[code % rows.length]}열 ${(code % 18) + 1}번`;
    document.getElementById('tNo').textContent = `MW-${typeKey ? pad(hall) : 'SP'}-${String(code).padStart(7, '0')}`;

    // 바코드: 답마다 굵기가 다른 막대를 그려요.
    const svg = document.getElementById('tBarcode');
    svg.innerHTML = '';
    const widths = [1, 2, 3];
    let x = 0, seed = code + hall * 7919;
    const bars = [];
    while (x < 132) {
      seed = (seed * 9301 + 49297) % 233280;
      const w = widths[seed % 3];
      if (x + w > 132) break;
      bars.push(`<rect x="${x}" y="0" width="${w}" height="38" fill="currentColor"/>`);
      x += w + widths[(seed >> 3) % 2] + 1;
    }
    svg.innerHTML = bars.join('');
  }

  function renderResult() {
    // 고른 답으로 점수 계산: 주 유형 +2, 보조 유형 +1
    const scores = Object.fromEntries(Object.keys(TYPES).map(k => [k, 0]));
    const lastPick = {}; // 유형별로 주 유형으로 마지막 선택된 질문 번호 (동점 처리용)
    answers.forEach((idx, qi) => {
      if (idx === SKIP) return;
      const [main, sub] = QUESTIONS[qi].opts[idx].s;
      scores[main] += 2;
      scores[sub] += 1;
      lastPick[main] = qi;
    });
    // 최고점 유형 중, 동점이면 더 최근 질문에서 주 유형으로 고른 쪽이 이겨요.
    const max = Math.max(...Object.values(scores));
    const top = Object.keys(scores)
      .filter(k => scores[k] === max)
      .sort((a, b) => (lastPick[b] ?? -1) - (lastPick[a] ?? -1))[0];
    const skipped = answers.filter(a => a === SKIP).length;
    const allSkipped = skipped === QUESTIONS.length;
    const t = allSkipped ? OPEN_TYPE : TYPES[top];
    document.getElementById('skipNote').hidden = allSkipped || skipped < SKIP_NOTE_MIN;
    document.getElementById('typeName').textContent = t.name;
    const kwEl = document.getElementById('typeKeywords');
    kwEl.innerHTML = '';
    t.keywords.forEach(k => {
      const s = document.createElement('span');
      s.className = 'kw';
      s.textContent = k;
      kwEl.appendChild(s);
    });
    document.getElementById('typeDesc').textContent = t.desc;
    fillTicketInfo(allSkipped ? null : top);
    const recsEl = document.getElementById('typeRecs');
    recsEl.innerHTML = '';
    pickMovies(t.movies, answerCode()).forEach(m => {
      const rec = document.createElement('div');
      rec.className = 'rec';

      const title = document.createElement('div');
      title.className = 'rec-title';
      title.textContent = m.title;
      const year = document.createElement('span');
      year.textContent = m.year;
      title.appendChild(year);

      const why = document.createElement('div');
      why.className = 'rec-why';
      why.textContent = m.why;

      const btn = document.createElement('a');
      btn.className = 'detail-btn';
      btn.href = 'https://www.google.com/search?q=' + encodeURIComponent(`영화 ${m.title} ${m.year}`);
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.setAttribute('aria-label', `${m.title} 상세보기 (새 탭에서 열림)`);
      btn.innerHTML = '상세보기 <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 2h6v6M10 2 3 9"/></svg>';

      rec.append(title, why, btn);
      recsEl.appendChild(rec);
    });
    show(resultScreen);
  }
</script>
